# NATS configuration for the combined Jarvis image.
#
# The bus carries no application-level authentication, so it is bound to
# loopback: only the ingestor and worker in this container can reach it.

host: "127.0.0.1"
port: 4222

# Monitoring endpoint the supervisor polls for /healthz before starting the worker.
http: "127.0.0.1:8222"

# Normalized Discord events carry attachment URLs rather than attachment bytes,
# so they stay far below this. The default 1MB would still be enough; this
# leaves room for unusually large message content.
max_payload: 8MB

jetstream {
  # Ephemeral by design. This gives redelivery when the worker crashes during
  # processing; it does not survive a container restart. Durable delivery is a
  # property of an external NATS cluster in the split deployment.
  store_dir: "/tmp/jetstream"
  max_memory_store: 256MB
  max_file_store: 1GB
}
